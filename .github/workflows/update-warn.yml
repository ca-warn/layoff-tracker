name: Update WARN dataset

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download latest WARN file
        run: |
          mkdir -p data
          curl -fL "https://edd.ca.gov/siteassets/files/jobs_and_training/warn/warn_report1.xlsx" \
            -o data/warn_report.xlsx

      - name: Detect changes
        id: changes
        run: |
          git add -N data/warn_report.xlsx
          if git diff --quiet -- data/warn_report.xlsx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/warn_report.xlsx
          git commit -m "chore: update WARN dataset"
          git push
