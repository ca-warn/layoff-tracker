name: Update WARN dataset

on:
  schedule:
    - cron: "0 10 * * *"   # daily at 10:00 UTC (~3am PT)
  workflow_dispatch:        # allows manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download latest WARN file
        run: |
          mkdir -p data
          curl -L "https://edd.ca.gov/siteassets/files/jobs_and_training/warn/warn_report1.xlsx" \
            -o data/warn_report.xlsx

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/warn_report.xlsx; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/warn_report.xlsx
          git commit -m "chore: update WARN dataset"
          git push
