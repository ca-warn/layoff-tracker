name: Update WARN dataset

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Resolve latest WARN workbook URL
        id: source
        run: |
          set -euo pipefail

          page_url="https://edd.ca.gov/en/jobs_and_training/Layoff_Services_WARN/"
          legacy_url="https://edd.ca.gov/siteassets/files/jobs_and_training/warn/warn_report1.xlsx"

          page_html="$(curl -fsSL -A 'Mozilla/5.0 (GitHub Actions WARN updater)' "$page_url")"
          resolved_url="$(printf '%s' "$page_html" | grep -Eo 'https://edd\.ca\.gov/siteassets/files/jobs_and_training/warn/[^"[:space:]]+\.xlsx' | head -n1 || true)"

          if [ -z "$resolved_url" ]; then
            resolved_url="$legacy_url"
          fi

          echo "url=$resolved_url" >> "$GITHUB_OUTPUT"

      - name: Download latest WARN file
        run: |
          set -euo pipefail

          mkdir -p data
          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            -A 'Mozilla/5.0 (GitHub Actions WARN updater)' \
            -e 'https://edd.ca.gov/en/jobs_and_training/Layoff_Services_WARN/' \
            "${{ steps.source.outputs.url }}" \
            -o data/warn_report.xlsx

      - name: Detect changes
        id: changes
        run: |
          git add -N data/warn_report.xlsx
          if git diff --quiet -- data/warn_report.xlsx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/warn_report.xlsx
          git commit -m "chore: update WARN dataset"
          git push
